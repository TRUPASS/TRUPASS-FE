# Trupass core API — 임시 초안 스펙
# 백엔드(Spring Boot)가 /v3/api-docs 를 제공하면 `pnpm gen:api --remote` 로 교체한다.
openapi: 3.0.3
info:
  title: Trupass Core API (draft)
  version: 0.0.1
  description: FE 초기 세팅용 최소 초안. 실제 스펙은 백엔드 OpenAPI 를 기준으로 한다.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
  - name: users
  - name: trip-requests
  - name: checkouts
paths:
  # 로그인 · 사용자: 백엔드(core)에 구현된 그대로 옮겼다 (AuthController, UserController).
  # 응답은 모두 공통 형식 {isSuccess, code, message, result} 이다. 백엔드처럼 응답 필드는 필수로 표시하지 않는다.
  /auth/google:
    post:
      tags: [auth]
      operationId: loginWithGoogle
      summary: Google 로그인
      description: >-
        FE 가 Google Identity Services 로 받은 ID 토큰(credential)을 보내면 검증 후 Trupass 토큰을 발급한다.
        처음이면 가입되고 newUser 가 true 다. user.profileCompleted 가 false 면(처음 가입했거나 회원 정보 입력을
        마치지 않고 나간 경우) 회원 정보 입력(PUT /users/me/profile)으로 보낸다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
      responses:
        '200':
          description: 로그인됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogin'
        default:
          description: 'AUTH401_1(ID 토큰 검증 실패) · AUTH401_2(이메일 미인증) · AUTH500_1(서버 설정 없음) · AUTH502_1(Google 연결 실패) · COMMON400_1'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: 토큰 재발급
      description: refresh token 은 한 번만 쓸 수 있고, 새 토큰 쌍을 돌려준다. 이미 쓴 것을 다시 보내면 그 사용자의 refresh token 이 모두 폐기된다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
      responses:
        '200':
          description: 새 토큰 쌍
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTokens'
        default:
          description: AUTH401_3(refresh token 이 틀렸거나 만료됨)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 로그아웃
      description: refresh token 을 폐기한다. access token 은 만료될 때까지 유효하다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
      responses:
        '200':
          description: 로그아웃됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /users/me:
    get:
      tags: [users]
      operationId: getMe
      summary: 내 정보
      description: 'Authorization: Bearer {accessToken} 필요. profileCompleted 가 false 면 회원 정보 입력을 아직 마치지 않았다.'
      responses:
        '200':
          description: 로그인한 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMe'
        default:
          description: COMMON401(토큰 없음) · COMMON401_1(토큰이 틀렸거나 만료됨) · USER404_1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /users/me/profile:
    put:
      tags: [users]
      operationId: updateProfile
      summary: 회원 정보 입력·수정
      description: >-
        회원 정보 입력 화면(/signup)의 닉네임 · 출생 연도 · 성별 · 여행 관심사 · 약관 동의를 저장한다. 처음 저장하면
        profileCompleted 가 true 가 된다. 설정에서 고칠 때도 같은 형식으로 전체를 보낸다(같은 값을 다시 보내도 결과가 같다).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: 저장한 뒤의 내 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMe'
        default:
          description: 'COMMON400_1(칸이 틀림. result 에 {칸: 메시지}) · COMMON400(없는 값) · USER400_1(출생 연도가 올해보다 뒤) · COMMON401 · COMMON401_1 · USER404_1'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/trip-requests:
    post:
      tags: [trip-requests]
      operationId: createTripRequest
      summary: 자연어 여행 요청 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequestBody'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTripRequestResponse'
  /api/trip-requests/{requestId}/packages:
    get:
      tags: [trip-requests]
      operationId: getPackageOptions
      summary: AI 가 만든 패키지 후보 조회
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 패키지 후보 목록 (2~3안)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackageOption'
  /api/checkouts:
    post:
      tags: [checkouts]
      operationId: createCheckout
      summary: 선택한 패키지로 체크아웃 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutBody'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutResponse'
  /api/checkouts/{checkoutId}/mandate:
    post:
      tags: [checkouts]
      operationId: submitMandate
      summary: 패스키(WebAuthn) 서명 결과(AP2 Mandate) 제출
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitMandateBody'
      responses:
        '204':
          description: 서명 접수됨
  /api/checkouts/{checkoutId}:
    get:
      tags: [checkouts]
      operationId: getCheckoutStatus
      summary: 체크아웃(Saga) 진행 상태 조회 — FE 가 폴링한다
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
      responses:
        '200':
          description: 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStatusResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema:
        type: string
  schemas:
    GoogleLogin:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Google Identity Services 가 준 credential (ID 토큰)
    Refresh:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    Logout:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    Tokens:
      type: object
      description: 'API 호출은 Authorization: Bearer {accessToken}. 만료되면 POST /auth/refresh 로 새 쌍을 받는다(refresh token 도 바뀐다).'
      properties:
        tokenType:
          type: string
          example: Bearer
        accessToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: access token 유효 시간(초)
        refreshToken:
          type: string
        refreshTokenExpiresIn:
          type: integer
          format: int64
          description: refresh token 유효 시간(초)
    Me:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
          description: Google 계정의 이름
        pictureUrl:
          type: string
          description: Google 계정의 프로필 사진 주소
        nickname:
          type: string
          nullable: true
          description: 닉네임. 회원 정보 입력 전에는 null
        birthYear:
          type: integer
          format: int32
          nullable: true
          description: 출생 연도. 회원 정보 입력 전에는 null
        gender:
          $ref: '#/components/schemas/Gender'
        interests:
          type: array
          description: 여행 관심사(0~3개)
          items:
            $ref: '#/components/schemas/TravelInterest'
        agreements:
          $ref: '#/components/schemas/AgreementStatus'
        profileCompleted:
          type: boolean
          description: 회원 정보 입력을 마쳤는가. false 면 회원 정보 입력(/signup)으로 보낸다
        createdAt:
          type: string
          format: date-time
    Gender:
      type: string
      nullable: true
      description: '성별. FEMALE 여성 · MALE 남성. "선택 안 함"은 null'
      enum: [FEMALE, MALE, null]
    TravelInterest:
      type: string
      description: >-
        여행 관심사. FOOD 미식 · 맛집, SIGHTSEEING 관광 · 명소, SHOPPING 쇼핑, RELAXATION 휴양 · 온천,
        CULTURE 문화 · 예술, ARCHITECTURE 건축 · 도시 산책, NATURE 자연 · 야외 활동, THEME_PARK 테마파크 · 체험
      enum: [FOOD, SIGHTSEEING, SHOPPING, RELAXATION, CULTURE, ARCHITECTURE, NATURE, THEME_PARK]
    Profile:
      type: object
      description: 회원 정보 입력·수정. 이메일은 Google 계정의 것이라 받지 않는다.
      required: [nickname, birthYear, agreements]
      properties:
        nickname:
          type: string
          description: 닉네임. 앞뒤 공백은 서버가 지운다. 2~12자, 제어 문자 불가
          minLength: 2
          maxLength: 12
          example: 도쿄여행자
        birthYear:
          type: integer
          format: int32
          description: 출생 연도. 1900년부터 올해(UTC)까지
          minimum: 1900
          example: 1994
        gender:
          $ref: '#/components/schemas/Gender'
        interests:
          type: array
          description: 여행 관심사. 0~3개. 빠뜨리면 빈 목록으로 본다
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TravelInterest'
        agreements:
          $ref: '#/components/schemas/Agreements'
    Agreements:
      type: object
      description: 약관 동의. termsOfService · privacyCollection 은 true 여야 한다
      required: [termsOfService, privacyCollection]
      properties:
        termsOfService:
          type: boolean
          description: (필수) Trupass 이용약관
        privacyCollection:
          type: boolean
          description: (필수) 개인정보 수집 · 이용
        marketing:
          type: boolean
          description: (선택) 여행 혜택 · 알림 수신. 보내지 않으면 false
    AgreementStatus:
      type: object
      description: 약관 동의 여부. 요청(Agreements)과 같은 모양이다
      properties:
        termsOfService:
          type: boolean
        privacyCollection:
          type: boolean
        marketing:
          type: boolean
    Login:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/Tokens'
        user:
          $ref: '#/components/schemas/Me'
        newUser:
          type: boolean
          description: 이번 로그인으로 가입했으면 true. 회원 정보 입력으로 보낼지는 user.profileCompleted 로 정한다
    ApiResponseLogin:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        result:
          $ref: '#/components/schemas/Login'
    ApiResponseTokens:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        result:
          $ref: '#/components/schemas/Tokens'
    ApiResponseMe:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        result:
          $ref: '#/components/schemas/Me'
    ApiResponseVoid:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
    ApiErrorResponse:
      type: object
      description: '실패 응답. code 는 에러 코드(예: AUTH401_1), result 는 입력값 오류일 때 필드별 메시지다.'
      properties:
        isSuccess:
          type: boolean
          example: false
        code:
          type: string
        message:
          type: string
        result:
          type: object
          additionalProperties: true
    CreateTripRequestBody:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: 다음 달에 오사카 2박 3일 다녀오고 싶어
    CreateTripRequestResponse:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
    Currency:
      type: string
      description: ISO 4217 통화 코드
      example: KRW
    OfferType:
      type: string
      enum: [FLIGHT, STAY, EXPERIENCE]
    PackageItem:
      type: object
      required: [offerId, merchant, type, name, amount]
      properties:
        offerId:
          type: string
        merchant:
          type: string
          description: 판매자 식별자/이름
        type:
          $ref: '#/components/schemas/OfferType'
        name:
          type: string
        amount:
          type: integer
          format: int64
          description: 판매자별 금액 (백엔드 계산 값, 최소 화폐 단위)
    PackageOption:
      type: object
      required: [packageId, title, totalAmount, currency, items]
      properties:
        packageId:
          type: string
        title:
          type: string
        totalAmount:
          type: integer
          format: int64
          description: 총액 (백엔드 계산 값. FE 는 계산하지 않는다)
        currency:
          $ref: '#/components/schemas/Currency'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PackageItem'
    CreateCheckoutBody:
      type: object
      required: [packageId]
      properties:
        packageId:
          type: string
    CreateCheckoutResponse:
      type: object
      required: [checkoutId]
      properties:
        checkoutId:
          type: string
    SubmitMandateBody:
      type: object
      description: >-
        TODO: 패스키(WebAuthn) 서명 결과 형식은 백엔드 WebAuthn 라이브러리 확정 후 정의한다.
      additionalProperties: true
    CheckoutStatus:
      type: string
      enum: [SIGNED, IN_PROGRESS, COMPLETED, COMPENSATING, FAILED, NEEDS_MANUAL_REVIEW]
    SagaStep:
      type: string
      enum: [HOLD, COLLECT, PAY, CONFIRM]
    StepState:
      type: string
      enum: [PENDING, SUCCEEDED, FAILED, COMPENSATED]
    CheckoutStepStatus:
      type: object
      required: [merchant, step, state]
      properties:
        merchant:
          type: string
        step:
          $ref: '#/components/schemas/SagaStep'
        state:
          $ref: '#/components/schemas/StepState'
    CheckoutStatusResponse:
      type: object
      required: [status, steps]
      properties:
        status:
          $ref: '#/components/schemas/CheckoutStatus'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutStepStatus'
