# Trupass core API — 임시 초안 스펙
# 백엔드(Spring Boot)가 /v3/api-docs 를 제공하면 `pnpm gen:api --remote` 로 교체한다.
openapi: 3.0.3
info:
  title: Trupass Core API (draft)
  version: 0.0.1
  description: FE 초기 세팅용 최소 초안. 실제 스펙은 백엔드 OpenAPI 를 기준으로 한다.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
  - name: users
  - name: trip-requests
  - name: checkouts
paths:
  # 로그인 · 사용자: 백엔드(core)에 구현된 그대로 옮겼다 (AuthController, UserController).
  # 응답은 모두 공통 형식 {isSuccess, code, message, result} 이다. 백엔드처럼 응답 필드는 필수로 표시하지 않는다.
  /auth/google:
    post:
      tags: [auth]
      operationId: loginWithGoogle
      summary: Google 로그인
      description: >-
        FE 가 Google Identity Services 로 받은 ID 토큰(credential)을 보내면 검증 후 Trupass 토큰을 발급한다.
        처음이면 가입되고 newUser 가 true 다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
      responses:
        '200':
          description: 로그인됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogin'
        default:
          description: 'AUTH401_1(ID 토큰 검증 실패) · AUTH401_2(이메일 미인증) · AUTH500_1(서버 설정 없음) · AUTH502_1(Google 연결 실패) · COMMON400_1'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: 토큰 재발급
      description: refresh token 은 한 번만 쓸 수 있고, 새 토큰 쌍을 돌려준다. 이미 쓴 것을 다시 보내면 그 사용자의 refresh token 이 모두 폐기된다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
      responses:
        '200':
          description: 새 토큰 쌍
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTokens'
        default:
          description: AUTH401_3(refresh token 이 틀렸거나 만료됨)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 로그아웃
      description: refresh token 을 폐기한다. access token 은 만료될 때까지 유효하다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
      responses:
        '200':
          description: 로그아웃됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /users/me:
    get:
      tags: [users]
      operationId: getMe
      summary: 내 정보
      description: 'Authorization: Bearer {accessToken} 필요'
      responses:
        '200':
          description: 로그인한 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMe'
        default:
          description: COMMON401(토큰 없음) · COMMON401_1(토큰이 틀렸거나 만료됨) · USER404_1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/trip-requests:
    post:
      tags: [trip-requests]
      operationId: createTripRequest
      summary: 자연어 여행 요청 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequestBody'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTripRequestResponse'
  /api/trip-requests/{requestId}/packages:
    get:
      tags: [trip-requests]
      operationId: getPackageOptions
      summary: AI 가 만든 패키지 후보 조회
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 패키지 후보 목록 (2~3안)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackageOption'
  /api/checkouts:
    post:
      tags: [checkouts]
      operationId: createCheckout
      summary: 선택한 패키지로 체크아웃 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutBody'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutResponse'
  /api/checkouts/{checkoutId}/mandate:
    post:
      tags: [checkouts]
      operationId: submitMandate
      summary: 패스키(WebAuthn) 서명 결과(AP2 Mandate) 제출
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitMandateBody'
      responses:
        '204':
          description: 서명 접수됨
  /api/checkouts/{checkoutId}:
    get:
      tags: [checkouts]
      operationId: getCheckoutStatus
      summary: 체크아웃(Saga) 진행 상태 조회 — FE 가 폴링한다
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
      responses:
        '200':
          description: 현재 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStatusResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema:
        type: string
  schemas:
    GoogleLogin:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Google Identity Services 가 준 credential (ID 토큰)
    Refresh:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    Logout:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    Tokens:
      type: object
      description: 'API 호출은 Authorization: Bearer {accessToken}. 만료되면 POST /auth/refresh 로 새 쌍을 받는다(refresh token 도 바뀐다).'
      properties:
        tokenType:
          type: string
          example: Bearer
        accessToken:
          type: string
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: access token 유효 시간(초)
        refreshToken:
          type: string
        refreshTokenExpiresIn:
          type: integer
          format: int64
          description: refresh token 유효 시간(초)
    Me:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
          description: Google 계정의 이름
        pictureUrl:
          type: string
          description: Google 계정의 프로필 사진 주소
        createdAt:
          type: string
          format: date-time
    Login:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/Tokens'
        user:
          $ref: '#/components/schemas/Me'
        newUser:
          type: boolean
          description: 이번 로그인으로 가입했으면 true
    ApiResponseLogin:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        result:
          $ref: '#/components/schemas/Login'
    ApiResponseTokens:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        result:
          $ref: '#/components/schemas/Tokens'
    ApiResponseMe:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
        result:
          $ref: '#/components/schemas/Me'
    ApiResponseVoid:
      type: object
      properties:
        isSuccess:
          type: boolean
        code:
          type: string
        message:
          type: string
    ApiErrorResponse:
      type: object
      description: '실패 응답. code 는 에러 코드(예: AUTH401_1), result 는 입력값 오류일 때 필드별 메시지다.'
      properties:
        isSuccess:
          type: boolean
          example: false
        code:
          type: string
        message:
          type: string
        result:
          type: object
          additionalProperties: true
    CreateTripRequestBody:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: 다음 달에 오사카 2박 3일 다녀오고 싶어
    CreateTripRequestResponse:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
    Currency:
      type: string
      description: ISO 4217 통화 코드
      example: KRW
    OfferType:
      type: string
      enum: [FLIGHT, STAY, EXPERIENCE]
    PackageItem:
      type: object
      required: [offerId, merchant, type, name, amount]
      properties:
        offerId:
          type: string
        merchant:
          type: string
          description: 판매자 식별자/이름
        type:
          $ref: '#/components/schemas/OfferType'
        name:
          type: string
        amount:
          type: integer
          format: int64
          description: 판매자별 금액 (백엔드 계산 값, 최소 화폐 단위)
    PackageOption:
      type: object
      required: [packageId, title, totalAmount, currency, items]
      properties:
        packageId:
          type: string
        title:
          type: string
        totalAmount:
          type: integer
          format: int64
          description: 총액 (백엔드 계산 값. FE 는 계산하지 않는다)
        currency:
          $ref: '#/components/schemas/Currency'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PackageItem'
    CreateCheckoutBody:
      type: object
      required: [packageId]
      properties:
        packageId:
          type: string
    CreateCheckoutResponse:
      type: object
      required: [checkoutId]
      properties:
        checkoutId:
          type: string
    SubmitMandateBody:
      type: object
      description: >-
        TODO: 패스키(WebAuthn) 서명 결과 형식은 백엔드 WebAuthn 라이브러리 확정 후 정의한다.
      additionalProperties: true
    CheckoutStatus:
      type: string
      enum: [SIGNED, IN_PROGRESS, COMPLETED, COMPENSATING, FAILED, NEEDS_MANUAL_REVIEW]
    SagaStep:
      type: string
      enum: [HOLD, COLLECT, PAY, CONFIRM]
    StepState:
      type: string
      enum: [PENDING, SUCCEEDED, FAILED, COMPENSATED]
    CheckoutStepStatus:
      type: object
      required: [merchant, step, state]
      properties:
        merchant:
          type: string
        step:
          $ref: '#/components/schemas/SagaStep'
        state:
          $ref: '#/components/schemas/StepState'
    CheckoutStatusResponse:
      type: object
      required: [status, steps]
      properties:
        status:
          $ref: '#/components/schemas/CheckoutStatus'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutStepStatus'
